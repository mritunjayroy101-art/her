<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0d0d0d; /* Deeper black for high contrast */
            font-family: 'Georgia', serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* The Card */
        .container {
            z-index: 10;
            text-align: center;
            max-width: 580px; /* Wider to fit the bears */
            padding: 50px;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255, 77, 109, 0.4);
            box-shadow: 0 0 60px rgba(255, 77, 109, 0.15);
            transition: all 0.5s ease;
        }

        .container.final {
            border-color: #ffb3c1;
            box-shadow: 0 0 70px rgba(255, 179, 193, 0.2);
        }

        h1 {
            font-size: 3.2rem;
            margin: 0;
            background: linear-gradient(45deg, #ff4d6d, #ffb3c1, #ff4d6d);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .message-box {
            min-height: 140px;
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sub-text {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #efefef;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sub-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Hugging Bears Art --- */
        #hug-art {
            display: none; /* Starts hidden */
            margin-top: 15px;
            font-family: 'Courier New', Courier, monospace; /* Essential for ASCII alignment */
            font-size: 1.1rem;
            line-height: 1.1;
            color: #ffb3c1; /* Soft pink */
            white-space: pre; /* Preserves spaces for alignment */
            text-align: left;
            opacity: 0;
            transition: opacity 2s ease-in 0.5s;
            animation: bear-sway 3s ease-in-out infinite alternate;
        }

        @keyframes bear-sway {
            from { transform: translateX(-5px); }
            to { transform: translateX(5px); }
        }

        /* --- Bouncy Button --- */
        button {
            background: linear-gradient(45deg, #ff4d6d, #c9184a);
            border: none;
            padding: 14px 45px;
            color: white;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.6);
        }

        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container" id="main-card">
        <h1 id="main-title">I'm Sorry</h1>
        
        <div class="message-box">
            <p id="msg" class="sub-text visible">I messed up, and I hate that I made you feel bad.</p>
            
            <pre id="hug-art">
   /\_/\    /\_/\   
  ( o.o )  ( ^.^ )  
   > ^ <    > w <   
 /   |   \ /   |   \
(_____|_____|_____| )
            </pre>
        </div>

        <button id="action-btn" onclick="nextStep()">Read More</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let step = 0;

        const messages = [
            "You are the most important person in my life. 🌟",
            "I've been replaying everything in my head, wishing I'd done better.",
            "I value us more than anything else in the world.",
            "Please let me make it up to you? I really miss you. ❤️"
        ];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor(symbol = "sorry") {
                this.reset(symbol);
            }
            reset(symbol) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 12 + 10;
                this.speedY = Math.random() * 0.6 + 0.2;
                this.opacity = Math.random() * 0.4;
                this.symbol = symbol;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.angle) * 0.3;
                this.angle += 0.02;
                if (this.y < -30) this.y = canvas.height + 30;
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = (this.symbol === "❤" || this.symbol === "🌸") ? "#ff4d6d" : "#ffffff";
                ctx.font = `${this.size}px Arial`;
                ctx.fillText(this.symbol, this.x, this.y);
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function nextStep() {
            const msgEl = document.getElementById('msg');
            const btn = document.getElementById('action-btn');
            const title = document.getElementById('main-title');
            const hugArt = document.getElementById('hug-art');

            msgEl.classList.remove('visible');

            setTimeout(() => {
                if (step < messages.length) {
                    msgEl.innerText = messages[step];
                    msgEl.classList.add('visible');
                    
                    if (step === 1) {
                        for(let i=0; i<20; i++) particles.push(new Particle("✨"));
                    }

                    if (step === messages.length - 1) {
                        particles = [];
                        for (let i = 0; i < 100; i++) {
                            const sym = Math.random() > 0.5 ? "❤" : "🌸";
                            particles.push(new Particle(sym));
                        }
                        title.innerText = "Forgive Me?";
                        btn.innerText = "I Love You";
                    }
                    step++;
                } else {
                    // Final 'Thank You' sequence
                    title.innerText = "Thank You";
                    msgEl.innerText = "I promise to make you smile tonight. ✨";
                    btn.style.display = "none";
                    
                    // Reveal the bears
                    hugArt.style.display = 'block'; // Show element
                    setTimeout(() => { hugArt.style.opacity = '1'; }, 10); // Fade in
                    
                    document.getElementById('main-card').classList.add('final');
                    createFinalBurst();
                }
            }, 600);
        }

        function createFinalBurst() {
            for(let i=0; i<50; i++) {
                let p = new Particle("❤");
                p.speedY = (Math.random() - 0.5) * 10;
                particles.push(p);
            }
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
